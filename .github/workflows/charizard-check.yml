# The required check of a pull request (tier `checks.pullRequest`:
# { name: check, app: github-actions, event: pull_request }). Its check run is named after the job.
# Replace the step with the repository's real tests; keep the job name the tier declares.
name: charizard-check
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The same command as `check` in the workspace's services/delivery-test-site.yaml: the page
      # exists and every site/test/*.test.js passes (a commit that breaks its own tests fails here).
      - name: The site has its page and its tests pass
        run: test -s site/index.html && node --test 'site/test/**/*.test.js'
